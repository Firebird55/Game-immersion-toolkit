name: Bug report
description: Report reproducible behavior using sanitized examples.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, version, device and browser
      description: Remove keys, personal paths and private transcript material.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks or synthetic example
  - type: input
    id: languages
    attributes:
      label: Game and languages (if relevant)
      description: Game, spoken language, on-screen subtitle language, and desired translation. No pack export is required.
  - type: dropdown
    id: capture
    attributes:
      label: Where did it happen?
      options:
        - Windows companion
        - Paired phone/tablet reader
        - Independent mobile OCR
        - Installation or update
        - Documentation / other
