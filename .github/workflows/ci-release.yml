name: Checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: scope
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-changed.mjs --plan ${{ startsWith(github.ref, 'refs/tags/') && '--full' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
        if: steps.scope.outputs.python == 'true'
      - run: npm ci
        if: steps.scope.outputs.dependencies == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.full == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Compile owned NTE reader without game assets
        if: steps.scope.outputs.full == 'true'
        run: dotnet build scripts/game-readers/NteReader.csproj -c Release -o data/ci-reader -p:BaseIntermediateOutputPath="${{ github.workspace }}/data/ci-reader-obj/" --nologo
      - uses: actions/cache@v4
        if: steps.scope.outputs.browsers == 'true'
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - run: npx playwright install chromium firefox webkit
        if: steps.scope.outputs.browsers == 'true'
      - name: Run selected checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-changed.mjs ${{ startsWith(github.ref, 'refs/tags/') && '--full' || '' }}
      - name: Validate and package release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/package-release.mjs
      - run: node scripts/validate-artifacts.mjs
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tested-release-assets
          path: |
            release/*.zip
            release/*.user.js
            release/*.txt
            release/*.md
            release/*.html
            release/*.json
            release/LICENSE
            release/SHA256SUMS
  publish:
    if: github.repository == 'Firebird55/Game-immersion-toolkit' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-assets
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "${{ github.ref_name }}" --generate-notes
