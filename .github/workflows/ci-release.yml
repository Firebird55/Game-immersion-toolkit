name: Checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload verified assets to the selected version tag (leave off for a candidate build)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  source-audit:
    # Public metadata checks inspect submitted identities. Application checks
    # separately verify GitHub's synthetic merge commit and both event parents.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare-release-version.mjs
      - name: Verify the source identity for publication audit
        run: node scripts/check-ci-gate.mjs checkout source-audit
      - run: npm run audit:public
      - name: Upload safe audit identity
        if: ${{ always() && hashFiles('output/checks/ci/source-audit.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-source-audit
          path: output/checks/ci/source-audit.json
          retention-days: 7
  check:
    runs-on: windows-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      scope_valid: ${{ steps.scope.outputs.scope_valid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Application checks use this exact event merge SHA for PRs.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/prepare-release-version.mjs
      - name: Verify the integration commit and PR merge parents
        run: node scripts/check-ci-gate.mjs checkout integration
      - name: Select affected checks
        id: plan
        env:
          CHECK_BASE: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: node scripts/check-changed.mjs --plan ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '--full' || '' }}
      - name: Validate scope before conditional checks
        id: scope
        env:
          CI_SCOPE_CHECKS: ${{ steps.plan.outputs.checks }}
          CI_SCOPE_FULL: ${{ steps.plan.outputs.full }}
          CI_SCOPE_DEPENDENCIES: ${{ steps.plan.outputs.dependencies }}
          CI_SCOPE_PYTHON: ${{ steps.plan.outputs.python }}
          CI_SCOPE_BROWSERS: ${{ steps.plan.outputs.browsers }}
        run: node scripts/check-ci-gate.mjs scope
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
        if: steps.scope.outputs.python == 'true'
      - run: npm ci
        if: steps.scope.outputs.dependencies == 'true'
      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.full == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Compile owned NTE reader without game assets
        if: steps.scope.outputs.full == 'true'
        run: dotnet build scripts/game-readers/NteReader.csproj -c Release -o data/ci-reader -p:BaseIntermediateOutputPath="${{ github.workspace }}/data/ci-reader-obj/" --nologo
      - uses: actions/cache@v6
        if: steps.scope.outputs.browsers == 'true' && steps.scope.outputs.full != 'true'
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - run: npx playwright install chromium firefox webkit
        if: steps.scope.outputs.browsers == 'true' && steps.scope.outputs.full != 'true'
      - name: Run selected checks
        env:
          CHECK_BASE: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          CHECK_SPLIT_BROWSER_TESTS: ${{ steps.scope.outputs.full == 'true' }}
          # The separate source-audit job checks PR author/history metadata.
          CHECK_SKIP_PUBLIC_AUDIT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: node scripts/check-changed.mjs ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '--full' || '' }}
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.full == 'true'
        with:
          name: checked-frontend
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Upload safe integration evidence
        if: ${{ always() && hashFiles('output/checks/ci/integration.json', 'output/checks/runs/*.json', 'output/checks/latest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-integration
          path: |
            output/checks/ci/integration.json
            output/checks/runs/*.json
            output/checks/latest.json
          retention-days: 7
  browser-checks:
    # Comprehensive PR gates need the same isolated runners as release gates.
    # A long sequence on one Windows runner can exhaust socket buffers.
    if: needs.check.outputs.scope_valid == 'true' && needs.check.outputs.full == 'true'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, setup, capture, offline, ocr]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/prepare-release-version.mjs
      - name: Verify the browser integration commit
        run: node scripts/check-ci-gate.mjs checkout browser
      - uses: actions/setup-python@v7
        if: matrix.suite == 'setup'
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
        if: matrix.suite == 'setup'
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - run: npx playwright install chromium firefox webkit
      - uses: actions/download-artifact@v8
        with:
          name: checked-frontend
          path: dist/
      - run: node scripts/prepare-mobile-assets.mjs
      - name: Check ${{ matrix.suite }} browsers
        run: node scripts/check-evidence.mjs --browser-suite ${{ matrix.suite }}
      - name: Upload safe browser evidence
        if: ${{ always() && hashFiles('output/checks/ci/browser.json', 'output/checks/runs/*.json', 'output/checks/latest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-${{ matrix.suite }}
          path: |
            output/checks/ci/browser.json
            output/checks/runs/*.json
            output/checks/latest.json
          retention-days: 7
  required-checks:
    # Keep this context stable for repository rules. Event parent verification
    # does not enforce branch freshness; strict up-to-date rules do that.
    if: ${{ always() }}
    needs: [source-audit, check, browser-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the gate integration commit
        run: node scripts/check-ci-gate.mjs checkout required-checks
      - name: Require all selected checks to succeed
        env:
          CI_SCOPE_VALID: ${{ needs.check.outputs.scope_valid }}
          CI_SCOPE_FULL: ${{ needs.check.outputs.full }}
          CI_AUDIT_RESULT: ${{ needs.source-audit.result }}
          CI_CHECK_RESULT: ${{ needs.check.result }}
          CI_BROWSER_RESULT: ${{ needs.browser-checks.result }}
        run: node scripts/check-ci-gate.mjs required
      - name: Upload safe gate evidence
        if: ${{ always() && hashFiles('output/checks/ci/required-checks.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-required-checks
          path: output/checks/ci/required-checks.json
          retention-days: 7
  package:
    # Manual candidate validation produces artifacts without invoking publish.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [source-audit, check, browser-checks, required-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/prepare-release-version.mjs
      - name: Verify the package source commit
        run: node scripts/check-ci-gate.mjs checkout package
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: checked-frontend
          path: dist/
      - name: Require an empty package output directory
        run: node -e "if (require('fs').existsSync('release')) throw new Error('Package output must be clean')"
      - name: Validate and package release artifacts
        run: node scripts/package-release.mjs
      - run: node scripts/validate-artifacts.mjs
      - run: npx playwright install chromium firefox webkit
      - name: Independently check the extracted candidate
        run: node scripts/check-evidence.mjs --candidate
      - name: Upload safe package evidence
        if: ${{ always() && hashFiles('output/checks/ci/package.json', 'output/checks/runs/*.json', 'output/checks/latest.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-package
          path: |
            output/checks/ci/package.json
            output/checks/runs/*.json
            output/checks/latest.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: tested-release-assets
          path: |
            release/*.zip
            release/*.user.js
            release/*.txt
            release/*.md
            release/*.html
            release/*.json
            release/LICENSE
            release/SHA256SUMS
  publish:
    if: (github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.repository == 'Firebird55/Game-immersion-toolkit' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tested-release-assets
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          fi
