name: Checks and release
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile owned NTE reader without game assets
        run: dotnet build scripts/game-readers/NteReader.csproj -c Release -o data/ci-reader -p:BaseIntermediateOutputPath="${{ github.workspace }}/data/ci-reader-obj/" --nologo
      - run: npm run check
      - run: npx playwright install chromium firefox webkit
      - run: node scripts/browser-e2e.mjs
      - run: node scripts/setup-e2e.mjs
      - run: node scripts/language-account-e2e.mjs
      - run: node scripts/update-companion-e2e.mjs
      - run: node scripts/companion-e2e.mjs
      - run: node scripts/mobile-capture-e2e.mjs
      - run: node scripts/mobile-recovery-e2e.mjs
      - run: npm run audit:public
      - name: Validate and package release artifacts
        run: node scripts/package-release.mjs
      - run: node scripts/validate-artifacts.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: tested-release-assets
          path: |
            release/*.zip
            release/*.user.js
            release/*.txt
            release/*.md
            release/*.html
            release/*.json
            release/LICENSE
            release/SHA256SUMS
  publish:
    if: github.repository == 'Firebird55/Game-immersion-toolkit' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-assets
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "${{ github.ref_name }}" --notes "Tested release with license notices, checksums and source provenance. See RELEASE.md."
