name: Checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: scope
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-changed.mjs --plan ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '--full' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.python == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
        if: steps.scope.outputs.python == 'true'
      - run: npm ci
        if: steps.scope.outputs.dependencies == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.scope.outputs.full == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Compile owned NTE reader without game assets
        if: steps.scope.outputs.full == 'true'
        run: dotnet build scripts/game-readers/NteReader.csproj -c Release -o data/ci-reader -p:BaseIntermediateOutputPath="${{ github.workspace }}/data/ci-reader-obj/" --nologo
      - uses: actions/cache@v4
        if: steps.scope.outputs.browsers == 'true' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - run: npx playwright install chromium firefox webkit
        if: steps.scope.outputs.browsers == 'true' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
      - name: Run selected checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_SPLIT_BROWSER_TESTS: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: node scripts/check-changed.mjs ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '--full' || '' }}
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: checked-frontend
          path: dist/
          include-hidden-files: true
          retention-days: 7
  browser-checks:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, setup, capture, offline, ocr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: matrix.suite == 'setup'
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright/package.json') }}
      - run: npx playwright install chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: checked-frontend
          path: dist/
      - run: node scripts/prepare-mobile-assets.mjs
      - name: Check ${{ matrix.suite }} browsers
        run: node scripts/check-browser-suite.mjs ${{ matrix.suite }}
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, browser-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: checked-frontend
          path: dist/
      - name: Validate and package release artifacts
        run: node scripts/package-release.mjs
      - run: node scripts/validate-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release-assets
          path: |
            release/*.zip
            release/*.user.js
            release/*.txt
            release/*.md
            release/*.html
            release/*.json
            release/LICENSE
            release/SHA256SUMS
  publish:
    if: github.repository == 'Firebird55/Game-immersion-toolkit' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-assets
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "${{ github.ref_name }}" --generate-notes
