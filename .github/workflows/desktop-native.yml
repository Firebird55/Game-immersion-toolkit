name: Native desktop construction
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  construct:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
            node_target: win-x64
            dotnet_rid: win-x64
          - runner: ubuntu-24.04
            target: linux-x64
            node_target: linux-x64
            dotnet_rid: linux-x64
          - runner: macos-15
            target: macos-arm64
            node_target: darwin-arm64
            dotnet_rid: osx-arm64
          # ONNX Runtime 1.24.4 publishes macOS arm64 wheels only. Intel
          # requires a separately verified native build before joining CI.
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            packaging/desktop/build-requirements.lock.txt
      - run: node scripts/prepare-release-version.mjs
      - name: Inspect missing build prerequisites before acquisition
        continue-on-error: true
        run: npm run dev:doctor -- --full
      - name: Prepare the exact native CPython supplier
        id: python_supplier
        run: python scripts/prepare-desktop-python.py --output output/python-supplier --cache output/python-archive-cache --github-output $env:GITHUB_OUTPUT --github-path $env:GITHUB_PATH
      - run: npm ci --ignore-scripts
      - name: Acquire exact native Python wheels
        run: |
          python -m pip download --only-binary=:all: --dest output/wheelhouse -r requirements.lock.txt -r packaging/desktop/build-requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-index --find-links output/wheelhouse -r requirements.lock.txt -r packaging/desktop/build-requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed wheel bytes before native construction
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'packaging/runtime-bundle'); from record_runtime import verify_wheel; [verify_wheel(wheel) for wheel in sorted(Path('output/wheelhouse').glob('*.whl'))]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux build-runner display services
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb trayer dbus-x11 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Fail with the actual missing library before Qt aborts without a
          # useful Python traceback. These are build-runner dependencies;
          # PyInstaller collects the runtime's native dependency closure.
          $plugin = python -c "from PySide6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath) + '/platforms/libqxcb.so')"
          $dependencies = ldd $plugin
          $dependencies | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($dependencies -match 'not found')) { exit 1 }
      - name: Test native lifecycle and exact supplier verification
        run: >-
          python -m pytest -q backend/tests/test_desktop_packaging.py
          backend/tests/test_desktop_host.py backend/tests/test_owned_process.py
          backend/tests/test_desktop_host_ui.py
          backend/tests/test_desktop_browser_environment.py
          backend/tests/test_linux_desktop_ui.py
          backend/tests/test_linux_system_resources.py
          backend/tests/test_desktop_release.py backend/tests/test_native_capture_probe.py
          backend/tests/test_macos_supplier_replay.py backend/tests/test_desktop_input_review.py
          backend/tests/test_cyberpunk_input_review.py backend/tests/test_cyberpunk_build.py
          backend/tests/test_cyberpunk_redistribution.py
          backend/tests/test_zzz_inputs.py backend/tests/test_zzz_input_review.py
          backend/tests/test_ooz_source_build.py backend/tests/test_native_zzz_probe.py
          backend/tests/test_production_zzz_reader.py backend/tests/test_zzz_toolchain_build.py
          backend/tests/test_desktop_build_environment.py
      - name: Retain exact Linux system library inputs and corresponding sources
        if: runner.os == 'Linux'
        run: python scripts/build-linux-system-resources.py --output output/linux-system-resources --cache output/linux-system-cache --sync-build-host
      - name: Probe native desktop discovery and capture
        run: |
          if ($IsLinux) { xvfb-run -a python scripts/probe-native-desktop-capture.py --output output/native-capture-probe.json }
          else { python scripts/probe-native-desktop-capture.py --output output/native-capture-probe.json }
          if ($LASTEXITCODE -eq 2) { Write-Output 'Native capture is unavailable on this runner; this is not native acceptance.'; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the exact build-host managed-reader SDK
        id: reader_sdk
        run: python scripts/prepare-game-reader-sdk.py --rid '${{ matrix.dotnet_rid }}' --output output/reader-sdk --cache output/reader-sdk-inputs --github-output $env:GITHUB_OUTPUT
      - name: Build the shared self-contained archive reader
        run: |
          ./scripts/build-game-reader-helpers.ps1 -Kind nte -RuntimeIdentifier '${{ matrix.dotnet_rid }}' -OutputRoot output/reader-helper -EvidenceRoot '${{ steps.reader_sdk.outputs.evidence_root }}' -Dotnet '${{ steps.reader_sdk.outputs.dotnet }}' -ExpectedSdkVersion 10.0.403 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build-nte-toolchain.py --platform '${{ matrix.node_target }}' --output output/managed-reader-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe-native-unreal.py --helper-root output/reader-helper/nte --resources output/managed-reader-resources --output output/native-unreal-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire the verified Windows codec build compiler
        if: runner.os == 'Windows'
        run: ./scripts/prepare-codec-compiler.ps1 -OutputRoot output/codec-compiler
      - name: Build and exercise the app-local Cyberpunk reader
        if: runner.os == 'Windows'
        run: |
          python scripts/build-cyberpunk-toolchain.py --platform win-x64 --cache output/cyberpunk-source-cache --output output/cyberpunk-resources --sdk-root '${{ steps.reader_sdk.outputs.sdk_root }}' --native-toolchain output/codec-compiler/w64devkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe-native-cyberpunk.py --resources output/cyberpunk-resources --output output/native-cyberpunk-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run desktop:build -- --output-root output/desktop-frontend
      - name: Collect the pinned app-local grammar runtime
        run: python scripts/build-node-toolchain.py --platform '${{ matrix.node_target }}' --output output/node-resources --retain-node-archive output/native-archives/node-supplier.archive
      - name: Build the ZZZ decompressor from retained preferred source
        run: |
          $nodeName = if ($IsWindows) { 'node.exe' } else { 'node' }
          $node = (Resolve-Path (Join-Path 'output/node-resources/toolchains/node' $nodeName)).Path
          python scripts/build-ooz-runtime.py --output output/ooz-build --work output/ooz-work --cache output/ooz-source-cache --node $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect and exercise the compiler-free ZZZ scene reader
        run: |
          $nodeName = if ($IsWindows) { 'node.exe' } else { 'node' }
          $node = (Resolve-Path (Join-Path 'output/node-resources/toolchains/node' $nodeName)).Path
          python scripts/build-zzz-toolchain.py --platform '${{ matrix.node_target }}' --output output/zzz-resources --evidence-root output/zzz-evidence --input-cache output/zzz-inputs --node-executable $node --ooz-build-root output/ooz-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe-native-zzz.py --zzz-resources output/zzz-resources --node-resources output/node-resources --output output/native-zzz-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain pinned Qt sources and full notices
        run: python scripts/build-qt-resources.py --output output/qt-resources --cache output/qt-source-cache
      - name: Retain exact OCR, ASR and native library sources and notices
        run: python scripts/build-native-notices.py --output output/native-notices --cache output/native-source-cache
      - name: Restore pinned audio source archives
        id: audio_source_cache
        uses: actions/cache/restore@v6
        with:
          # Source tarballs only: no compiler output, native ZIPs or game files.
          # acquire() hashes every restored archive against this exact policy.
          path: |
            output/audio-source-cache/*.tar.xz
            output/audio-source-cache/*.tar.gz
            output/audio-source-cache/*.tar.bz2
          key: audio-sources-v1-${{ hashFiles('packaging/codecs/audio-runtime.json') }}
          enableCrossOsArchive: true
      - name: Build maintained audio tools from retained sources
        id: audio_build
        run: |
          $options = @('--work', (Join-Path $env:RUNNER_TEMP 'toolkit-codec-build'), '--output', 'output/audio-resources', '--cache', 'output/audio-source-cache', '--jobs', '4')
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $options += @('--shell', (Join-Path $gitRoot 'usr/bin/bash.exe'), '--toolchain', (Resolve-Path 'output/codec-compiler/w64devkit').Path, '--windows-vgmstream')
          } else { $options += @('--shell', '/bin/sh') }
          python scripts/build-audio-runtime.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/probe-native-audio.py --resources output/audio-resources --output output/native-audio-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save verified audio source archives
        if: steps.audio_build.outcome == 'success' && steps.audio_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            output/audio-source-cache/*.tar.xz
            output/audio-source-cache/*.tar.gz
            output/audio-source-cache/*.tar.bz2
          key: ${{ steps.audio_source_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Freeze the native runtime and isolated ASR child
        run: |
          $options = @('--frontend-root', 'output/desktop-frontend', '--output', 'output/native-candidate', '--wheelhouse', 'output/wheelhouse', '--python-archive', '${{ steps.python_supplier.outputs.python_archive }}', '--nte-helper-root', 'output/reader-helper/nte')
          foreach ($root in @('output/audio-resources', 'output/node-resources', 'output/zzz-resources', 'output/qt-resources', 'output/native-notices', 'output/managed-reader-resources')) { $options += @('--resources-root', $root) }
          if ($IsWindows) { $options += @('--resources-root', 'output/cyberpunk-resources') }
          if ($IsLinux) { $options += @('--resources-root', 'output/linux-system-resources') }
          python scripts/build-desktop-runtime.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Review the exact delivered dependency inputs
        id: review
        run: |
          $options = @('-I', 'scripts/review-desktop-inputs.py', '--runtime-root', 'output/native-candidate/runtime/GameImmersionToolkit', '--provenance', 'output/native-candidate/CANDIDATE-PROVENANCE.json', '--observed-inputs', 'output/native-candidate/OBSERVED-INPUTS.json', '--python-archive', '${{ steps.python_supplier.outputs.python_archive }}', '--wheelhouse', 'output/wheelhouse', '--target', '${{ matrix.target }}', '--output', 'output/native-input-review.json', '--native-archive', 'output/native-archives/node-supplier.archive')
          foreach ($archive in Get-ChildItem '${{ steps.reader_sdk.outputs.evidence_root }}/nuget-feed' -Filter '*.nupkg' -File) { $options += @('--native-archive', $archive.FullName) }
          $zzzPins = Get-Content packaging/zzz-reader/production-inputs.json -Raw | ConvertFrom-Json
          foreach ($archive in $zzzPins.archives | Where-Object { $_.role -ne 'source' }) {
            $options += @('--native-archive', (Join-Path 'output/zzz-inputs' $archive.archive))
          }
          if ($IsWindows) {
            $codecs = Get-Content packaging/codecs/audio-runtime.json -Raw | ConvertFrom-Json
            $options += @('--native-archive', (Join-Path 'output/audio-source-cache' $codecs.vgmstream.windows_artifact.archive))
            foreach ($archive in @('wolvenkit.archive', 'dotnet.archive', 'source.archive', 'kraken-source.archive')) {
              $options += @('--native-archive', (Join-Path 'output/cyberpunk-source-cache' $archive))
            }
            $cyberpunkPins = Get-Content packaging/cyberpunk/redistribution.json -Raw | ConvertFrom-Json
            foreach ($package in $cyberpunkPins.packages) {
              $options += @('--native-archive', (Join-Path 'output/cyberpunk-source-cache/nuget' $package.archive))
            }
          }
          python @options
          if ($LASTEXITCODE -notin @(0, 2)) { exit $LASTEXITCODE }
          $review = Get-Content output/native-input-review.json -Raw | ConvertFrom-Json
          "approved=$($review.approved.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $review.approved) { Write-Output 'Exact input review is incomplete; installer remains an unpublished candidate.' }
          exit 0
      - name: Exercise frozen startup, API crash recovery and owned shutdown
        run: python scripts/probe-desktop-host.py --runtime-root output/native-candidate/runtime/GameImmersionToolkit --provenance output/native-candidate/CANDIDATE-PROVENANCE.json --output output/native-host-probe.json
      - name: Observe native window, tray and mounted transcript navigation
        run: |
          $options = @('--runtime-root', 'output/native-candidate/runtime/GameImmersionToolkit', '--provenance', 'output/native-candidate/CANDIDATE-PROVENANCE.json', '--output', 'output/native-ui-probe.json')
          if ($IsLinux) { xvfb-run -a dbus-run-session -- python scripts/probe-linux-desktop-ui.py @options }
          else { python scripts/probe-desktop-host.py --ui @options }
          if ($LASTEXITCODE -eq 2) { Write-Output 'Native UI unavailable on this runner; acceptance remains incomplete.'; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire verified Windows installer compiler
        if: runner.os == 'Windows'
        run: ./scripts/prepare-installer-compiler.ps1 -OutputRoot output/installer-compiler
      - name: Accept the exact native target
        if: steps.review.outputs.approved == 'true'
        run: python scripts/accept-desktop-runtime.py --runtime-root output/native-candidate/runtime/GameImmersionToolkit --provenance output/native-candidate/CANDIDATE-PROVENANCE.json --target '${{ matrix.target }}' --input-review output/native-input-review.json --native-report output/native-host-probe.json --native-report output/native-ui-probe.json --output output/ACCEPTED-PROVENANCE.json
      - name: Construct the platform installer
        id: package
        run: |
          $provenance = if (Test-Path output/ACCEPTED-PROVENANCE.json) { 'output/ACCEPTED-PROVENANCE.json' } else { 'output/native-candidate/CANDIDATE-PROVENANCE.json' }
          $receipt = Get-Content $provenance -Raw | ConvertFrom-Json
          $options = @('--runtime-root', 'output/native-candidate/runtime/GameImmersionToolkit', '--provenance', $provenance, '--target', '${{ matrix.target }}', '--output', 'output/native-distribution')
          if ($receipt.profile -ne 'runtime' -or $receipt.redistribution_review -ne 'approved' -or $receipt.native_acceptance -ne 'approved') { $options += '--candidate' }
          if ($IsWindows) { $options += @('--iscc', 'output/installer-compiler/compiler/ISCC.exe') }
          if ($IsMacOS) { $options += '--dmg' }
          python scripts/package-desktop.py @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content 'output/native-distribution/DESKTOP-PROVENANCE-${{ matrix.target }}.json' -Raw | ConvertFrom-Json
          "release_eligible=$($result.release_eligible.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      # Candidate metadata is useful evidence, but never substitutes for a
      # completed target receipt when the publication job assembles all assets.
      - name: Upload safe construction metadata only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-construction-${{ matrix.target }}
          path: |
            output/native-distribution/DESKTOP-PROVENANCE-${{ matrix.target }}.json
            output/native-distribution/SHA256SUMS
            output/native-capture-probe.json
            output/native-audio-probe.json
            output/native-host-probe.json
            output/native-ui-probe.json
            output/native-cyberpunk-probe.json
            output/native-unreal-probe.json
            output/native-zzz-probe.json
            output/native-input-review.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified desktop release assets
        if: steps.package.outputs.release_eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tested-desktop-${{ matrix.target }}
          path: |
            output/native-distribution/*.zip
            output/native-distribution/*.tar.gz
            output/native-distribution/*.dmg
            output/native-distribution/*.exe
            output/native-distribution/DESKTOP-PROVENANCE-${{ matrix.target }}.json
            output/native-distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
