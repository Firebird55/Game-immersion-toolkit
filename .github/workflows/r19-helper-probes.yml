name: R19 compiler-free authored helper probes
on:
  push:
    branches: [codex/r19-runtime-bundle]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r19-helper-probes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Observe prerequisites before build dependency preparation
        shell: pwsh
        run: |
          git remote add upstream https://github.com/Firebird55/Game-immersion-toolkit.git
          git fetch upstream main
          if ($LASTEXITCODE -ne 0) { throw 'Actual comparison target is unavailable.' }
          npm run dev:doctor -- --base upstream/main
          if ($LASTEXITCODE -notin @(0, 2)) { throw 'Invalid build preflight.' }
          exit 0
      - run: npm run audit:public
      - name: Provision the exact observed SDK on the build host only
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'r19-managed-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $archive = Join-Path $evidence 'dotnet-sdk-10.0.403-win-x64.zip'
          Invoke-WebRequest -Uri 'https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.403/dotnet-sdk-10.0.403-win-x64.zip' -OutFile $archive
          $expected = '7a114c318fa7f1d9822991b534b2814d0e78386ceda816b371f5141acefe741d87ccb606ede06cadac8f9ac5070e32b708a67bbd1619ff5e5a7858a27874ef48'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) { throw 'SDK archive differs from the exact official release metadata.' }
          $sdk = Join-Path $env:RUNNER_TEMP 'r19-managed-sdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $sdk
          "R19_MANAGED_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "R19_DOTNET=$(Join-Path $sdk 'dotnet.exe')" >> $env:GITHUB_ENV
      - name: Publish fixed self-contained authored probe and owned NTE bridge
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Split-Path $env:R19_DOTNET
          $env:DOTNET_CLI_HOME = Join-Path $env:RUNNER_TEMP 'r19-managed-cli'
          $env:DOTNET_SKIP_FIRST_TIME_EXPERIENCE = '1'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          ./scripts/build-game-reader-helpers.ps1 -Kind probe -OutputRoot output/helper-probes -EvidenceRoot $env:R19_MANAGED_EVIDENCE -Dotnet $env:R19_DOTNET -ExpectedSdkVersion 10.0.403
          ./scripts/build-game-reader-helpers.ps1 -Kind nte -OutputRoot output/owned-nte-bridge -EvidenceRoot $env:R19_MANAGED_EVIDENCE -Dotnet $env:R19_DOTNET -ExpectedSdkVersion 10.0.403
          # The owned reflection bridge contains no upstream DLL, codec, game
          # constants or game data. It is quarantined, never executed on a game
          # or uploaded. Full NTE dynamic-loading/rights gates remain open.
      - name: Exercise the actual helper without SDK/compiler discovery
        shell: pwsh
        run: ./scripts/probe-game-reader-helper.ps1 -HelperRoot output/helper-probes/probe
      - name: Upload sanitized observation only
        uses: actions/upload-artifact@v7
        with:
          name: r19-managed-helper-metadata
          path: output/checks/r19-managed-helper.json
          retention-days: 7
  node-probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Observe prerequisites before build preparation
        shell: pwsh
        run: |
          git remote add upstream https://github.com/Firebird55/Game-immersion-toolkit.git
          git fetch upstream main
          if ($LASTEXITCODE -ne 0) { throw 'Actual comparison target is unavailable.' }
          npm run dev:doctor -- --base upstream/main
          if ($LASTEXITCODE -notin @(0, 2)) { throw 'Invalid build preflight.' }
          exit 0
      - run: npm run audit:public
      - name: Acquire an exact observed app-local Node archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'node-v24.22.1-win-x64.zip'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.22.1/node-v24.22.1-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5') { throw 'Node archive differs from official SHASUMS256.' }
          "R19_NODE_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: Build and run only the authored Node/worker/WASM probe
        shell: pwsh
        run: |
          node scripts/build-zzz-reader-helper.mjs --node-archive $env:R19_NODE_ARCHIVE --platform win-x64 --output-root output/zzz-helper-probe --probe
          if ($LASTEXITCODE -ne 0) { throw 'Authored bundled Node probe failed.' }
      - name: Upload sanitized observation only
        uses: actions/upload-artifact@v7
        with:
          name: r19-node-helper-metadata
          path: output/checks/r19-node-helper.json
          retention-days: 7
