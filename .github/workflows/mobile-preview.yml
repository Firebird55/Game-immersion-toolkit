name: Connected reader diagnostics

# The standalone hosted gaming application is retired. Keep an explicit,
# unpublished diagnostic for the supported desktop-to-iOS browser reader.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connected-reader-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-reader:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements.lock.txt -r packaging/desktop/build-requirements.lock.txt
      - run: npx playwright install chromium firefox webkit
      - name: Verify the shared desktop reader over its actual LAN gateway
        run: node scripts/desktop-lan-e2e.mjs
      - run: npm run audit:public
      - name: Record the scoped result
        run: |
          printf '### Connected desktop reader\n\nCommit: `%s`\n\nThe desktop-hosted reader was exercised in Chromium, Firefox and WebKit against authored API/audio fixtures. This workflow publishes no website or application and makes no physical iOS or Android acceptance claim.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
