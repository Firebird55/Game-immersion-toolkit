name: Online companion
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'public/mobile-capture/**'
      - 'mobile/**'
      - 'scripts/companion-e2e.mjs'
      - 'scripts/mobile-reader-layout-e2e.mjs'
      - 'scripts/webrtc-runtime-probe.mjs'
      - 'vendor/lexirise-components/**'
      - 'scripts/build-browser-reader.mjs'
      - 'services/lexirise-gateway/**'
      - 'tests/mobile-*.test.mjs'
      - 'scripts/build-mobile-preview.mjs'
      - 'scripts/serve-mobile-capture.mjs'
      - 'scripts/mobile-capture-e2e.mjs'
      - 'scripts/mobile-recovery-e2e.mjs'
      - 'services/pairing/**'
      - 'tests/mobile-recovery.test.mjs'
      - 'scripts/mobile-library-e2e.mjs'
      - 'scripts/mobile-update-e2e.mjs'
      - 'scripts/mobile-layout-e2e.mjs'
      - 'scripts/mobile-assets.mjs'
      - 'scripts/mobile-ocr-integrity.json'
      - 'scripts/prepare-mobile-assets.mjs'
      - 'tests/mobile-library.test.mjs'
      - 'tests/mobile-pairing-qr.test.mjs'
      - 'tests/mobile-media-fixtures.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-capture.test.mjs'
      - '.github/workflows/mobile-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checked-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci
      - run: npm run check
      - run: npm run audit:public
  webkit-transcript:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-mobile-assets.mjs
      - run: npx playwright install chromium webkit
      - name: Check WebKit UI and native transcript transport capability
        env:
          MOBILE_TEST_BROWSERS: webkit
        run: node scripts/companion-e2e.mjs
  preview:
    needs: checked-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked browser and OCR dependencies
        run: npm ci --ignore-scripts
      - name: Check capture and library logic
        run: node scripts/prepare-mobile-assets.mjs && node --test tests/mobile-capture.test.mjs tests/mobile-library.test.mjs tests/mobile-pairing-qr.test.mjs tests/mobile-recovery.test.mjs tests/mobile-vault.test.mjs tests/mobile-gateway.test.mjs tests/mobile-transcript.test.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: mobile-preview-${{ runner.os }}-playwright-1.64.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Package public preview files
        id: package
        run: node scripts/build-mobile-preview.mjs
      - name: Check normal companion UI, vault and transcript sharing
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/companion-e2e.mjs
      - name: Check phone reading density and lookup layout
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/mobile-reader-layout-e2e.mjs
      - name: Check packaged browser pairing and phone layouts
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/mobile-capture-e2e.mjs
      - name: Check automatic recovery against a local Cloudflare runtime
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/mobile-recovery-e2e.mjs
      - name: Check private file reading, OCR and original-voice playback in three engines
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/mobile-library-e2e.mjs
      - name: Check application updates and offline data preservation
        env:
          MOBILE_PREVIEW_DIR: ${{ steps.package.outputs.directory }}
        run: node scripts/mobile-update-e2e.mjs
      - name: Check game-layout crops with owned synthetic scenes
        run: node scripts/mobile-layout-e2e.mjs
      - name: Retain owned browser-fixture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: |
            output/playwright/mobile-library-*.png
            output/playwright/mobile-reader-*.png
            output/playwright/mobile-lookup-*.png
            output/playwright/mobile-layout-overflow-*.png
          retention-days: 3
      - name: Retain reviewed static build
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ github.sha }}
          path: ${{ steps.package.outputs.directory }}
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ steps.package.outputs.directory }}
      - name: Record tested version
        run: |
          printf '### Tested mobile preview\n\nCommit: `%s`\n\nAllowlisted browser/OCR assets packaged; no game libraries or user data. HTTPS deployment runs when repository variable MOBILE_PREVIEW_ENABLED is true and GitHub Pages is configured.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'Firebird55/Game-immersion-toolkit' && vars.MOBILE_PREVIEW_ENABLED == 'true'
    needs: [preview, webkit-transcript]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish HTTPS preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment URL
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '### Mobile preview\n\n%s\n\nCommit: `%s`\n\nOpen on iPad and phone, then tap **Reload latest** before pairing.\n' "$PREVIEW_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
