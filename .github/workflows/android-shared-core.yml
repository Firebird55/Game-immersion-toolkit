name: Android API34 insets diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-api34-insets-diagnostic-67b
  cancel-in-progress: false
env:
  ANDROID_SOURCE_COMMIT: 67b3cf821f97b68bde1f7a025f4fa5c90fd9cc4e
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run dev:doctor
        continue-on-error: true
      - run: npm ci --ignore-scripts
      - name: Verify unchanged approved geometry and numeric evidence helper
        run: |
          git fetch --no-tags origin 6a26cfcf8c0a5a0609640315130efb6584a3dcc0
          git diff --exit-code 6a26cfcf8c0a5a0609640315130efb6584a3dcc0 -- scripts/android-authored-reader-insets.mjs
          node --test tests/android-authored-reader-insets.test.mjs tests/android-runtime-diagnostics.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: android-shared-core-candidate
          run-id: 44210651346
          github-token: ${{ github.token }}
          path: output/android-downloaded
      - name: Bind immutable existing APK and source, without building software
        run: |
          mkdir -p output/android-candidate output/android-update
          cp output/android-downloaded/android-candidate/* output/android-candidate/
          cp output/android-downloaded/android-update/* output/android-update/
          node --input-type=module -e "import{readFileSync}from'node:fs';import{createHash}from'node:crypto';import assert from'node:assert/strict';for(const [dir,version,digest]of[['android-candidate',1,'17e4980f52888c9ddf62d4344180392c511df0872423e08574b680f94d130e31'],['android-update',2,'df8234769f84e7b6381447bc4ff872f1ad867f8bbda6e9761ea071ec324db1b4']]){const p=JSON.parse(readFileSync('output/'+dir+'/ANDROID-PROVENANCE.json'));assert.equal(p.source_commit,process.env.ANDROID_SOURCE_COMMIT);assert.equal(p.source_dirty,false);assert.equal(p.version_code,version);assert.equal(p.variant,'debug');assert.equal(p.application_id,'io.github.firebird55.gameimmersiontoolkit.debug');assert.equal(p.apk_sha256,digest);assert.equal(createHash('sha256').update(readFileSync('output/'+dir+'/GameImmersionToolkit-android-debug.apk')).digest('hex'),digest)}"
      - name: Permit the hosted runner's existing KVM device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnose exact existing API34 APK before rotation restoration
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TOOLKIT_ANDROID_EXPECTED_API: '34'
          TOOLKIT_INSETS_DIAGNOSTIC_ONLY: '1'
          TOOLKIT_DIAGNOSTIC_HARNESS_SOURCE: ${{ github.sha }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: node scripts/probe-android-runtime.mjs output/android-candidate output/android-insets-diagnostic output/android-update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api34-insets-before-restore-67b
          if-no-files-found: warn
          retention-days: 7
          path: output/android-insets-diagnostic/
