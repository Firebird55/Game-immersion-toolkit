name: Android existing-candidate receiver diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-existing-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  ANDROID_SOURCE_COMMIT: a16f58803e8ba868a62c541151c35add46c8ba8d
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run dev:doctor
        continue-on-error: true
      - run: npm ci --ignore-scripts
      - run: node --test tests/android-runtime-diagnostics.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: android-shared-core-candidate
          path: output/android-downloaded
          run-id: 44013889661
          github-token: ${{ github.token }}
      - name: Verify unchanged candidate identity
        run: |
          mkdir -p output/android-candidate output/android-update output/android-runtime
          cp output/android-downloaded/android-candidate/* output/android-candidate/
          cp output/android-downloaded/android-update/* output/android-update/
          node --input-type=module -e "import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';import assert from'node:assert/strict';for(const dir of ['android-candidate','android-update']){const p=JSON.parse(readFileSync('output/'+dir+'/ANDROID-PROVENANCE.json'));assert.equal(p.source_commit,process.env.ANDROID_SOURCE_COMMIT);assert.equal(p.source_dirty,false);assert.equal(createHash('sha256').update(readFileSync('output/'+dir+'/GameImmersionToolkit-android-debug.apk')).digest('hex'),p.apk_sha256)}writeFileSync('output/android-runtime/diagnostic-source.json',JSON.stringify({diagnostic_source_commit:process.env.GITHUB_SHA,apk_source_commit:process.env.ANDROID_SOURCE_COMMIT,artifact_run_id:44013889661,apk_rebuilt:false})+'\n')"
      - name: Permit the hosted runner KVM device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe unchanged native receiver handoffs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: node scripts/probe-android-runtime.mjs output/android-candidate output/android-runtime output/android-update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-receiver-handoff-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: output/android-runtime/
