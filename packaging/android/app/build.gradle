plugins { id 'com.android.application'; id 'com.chaquo.python' }

def repository = rootProject.projectDir.parentFile.parentFile
def wheelhouse = System.getenv('ANDROID_PYTHON_WHEELHOUSE')
def readerFrontend = System.getenv('ANDROID_FRONTEND_DIR')
def decoderBundle = System.getenv('ANDROID_DATA_DECODERS')
def hashBundle = System.getenv('ANDROID_PUBLISHER_HASH')
if (!hashBundle || !new File(hashBundle, 'assets/publisher-hash-manifest.json').isFile()) {
    throw new GradleException('Build the reviewed bounded publisher hash bundle first.')
}
def cryptoBundle = System.getenv('ANDROID_PUBLISHER_CRYPTO')
def cryptoFixtures = System.getenv('ANDROID_CRYPTO_FIXTURES')
def wuwaFixture = System.getenv('ANDROID_WUWA_FIXTURE')
if (!wuwaFixture || !new File(wuwaFixture).isFile()) {
    throw new GradleException('Prepare the bounded authored publisher bootstrap data fixture first.')
}
if (!cryptoBundle || !new File(cryptoBundle, 'assets/publisher-crypto-manifest.json').isFile() ||
    !cryptoFixtures || !new File(cryptoFixtures, 'publisher-crypto-authored-jca.bin').isFile()) {
    throw new GradleException('Prepare the reviewed publisher cryptography bundle and authored fixtures first.')
}
if (!decoderBundle || !new File(decoderBundle, 'assets/native-decoder-manifest.json').isFile()) {
    throw new GradleException('Build the pinned original-data decoder software closure first.')
}
if (!readerFrontend || !new File(readerFrontend, 'desktop-manifest.json').isFile()) {
    throw new GradleException('Build the actual shared desktop reader before constructing Android.')
}
if (!wheelhouse || !new File(wheelhouse, 'requirements-android.lock.txt').isFile() || !new File(wheelhouse, 'zstandard-build-receipt.json').isFile()) {
    throw new GradleException('Prepare the verified offline Android Python wheelhouse first.')
}
def generatedPython = layout.buildDirectory.dir('generated/toolkit-python')
def generatedAssets = layout.buildDirectory.dir('generated/toolkit-assets')
def publisherPolicyFile = new File(repository, 'packaging/android/publisher-sources.json')
def publisherPolicy = new groovy.json.JsonSlurper().parse(publisherPolicyFile)
if (publisherPolicy.schema != 'toolkit-android-publisher-sources-v1') throw new GradleException('Unsupported packaged publisher source policy.')
def portableSources = ['__init__.py', 'models.py', 'config.py', 'language_contracts.py', 'languages.py',
    'local_game.py', 'textmaps.py', 'text_display.py', 'bilingual.py', 'multilingual_index.py', 'storage.py',
    'runtime_writers.py', 'sqlite_operation_lifetime.py', 'steam_games.py', 'capture_confirmation.py',
    'endfield_caption_context.py', 'endfield_presentation.py', 'endfield_sns_presentation.py', 'endfield_training_presentation.py', 'floating_caption_policy.py',
    'wuthering_text_templates.py', 'capture_geometry.py', 'caption_layout.py', 'nte_dialogue_context.py',
    'prepared_library.py', 'prepared_session.py', 'android_host.py', 'android_probe.py', 'android_protected_storage.py',
    'android_accounts.py', 'android_account_api.py', 'accounts.py', 'lexirise.py', 'lexirise_settings.py',
    'reading.py', 'runtime_readers.py', 'grammar.py', 'protected_storage.py', 'export_lock.py', 'atomic_files.py',
    'line_presentation.py', 'android_game_probe.py', 'android_authored_accounts.py', 'android_authored_game_data.py', 'android_account_recovery.py',
    'native_frame_admission.py', 'browser_history_migration.py']
portableSources += ['game_data_protocol.py', 'game_data.py', 'game_data_providers.py',
    'publisher_transport.py', 'publisher_crypto.py', 'source_recordings.py', 'private_data_paths.py', 'android_publisher_hash.py', 'android_x64_decoder.py', 'android_x64_fixtures.py', 'genshin_native_x64.py']
publisherPolicy.files.each { name, receipt ->
    if (!(name ==~ /backend\/[a-z0-9_]+\.py/)) throw new GradleException('Invalid packaged publisher source path.')
    def source = new File(repository, name)
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8')).encodeHex().toString()
    if (digest != receipt.sha256_lf) throw new GradleException('Review the changed publisher source before adding it to Android: ' + name)
    portableSources += name.substring('backend/'.length())
}
if (portableSources.toSet().size() != portableSources.size()) throw new GradleException('Duplicate owned Python source.')

android {
    namespace 'io.github.firebird55.gameimmersiontoolkit'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'io.github.firebird55.gameimmersiontoolkit'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName '0.23.2-android-prototype'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        debug {
            def store = System.getenv('ANDROID_DEBUG_KEYSTORE')
            if (!store) throw new GradleException('Set ANDROID_DEBUG_KEYSTORE to a private build-host debug key.')
            storeFile file(store)
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
        owner {
            def store = System.getenv('ANDROID_OWNER_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('TOOLKIT_OWNER_KEY_PASSWORD')
                keyAlias 'toolkit-owner'; keyPassword System.getenv('TOOLKIT_OWNER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false; signingConfig signingConfigs.owner }
        ownerCandidate {
            initWith release
            debuggable true
            signingConfig signingConfigs.owner
            matchingFallbacks = ['release']
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir generatedAssets; jniLibs.srcDir new File(decoderBundle, 'jniLibs'); jniLibs.srcDir new File(cryptoBundle, 'jniLibs'); jniLibs.srcDir new File(hashBundle, 'jniLibs') } }
    packaging { jniLibs { useLegacyPackaging false; keepDebugSymbols += ['**/libtoolkit_x64_decoder.so', '**/libtoolkit_publisher_crypto.so', '**/libtoolkit_publisher_hash.so'] } }
}

chaquopy {
    defaultConfig {
        version '3.12'
        extractPackages 'opencc', 'certifi'
        def python = System.getenv('TOOLKIT_BUILD_PYTHON')
        if (!python) throw new GradleException('Set TOOLKIT_BUILD_PYTHON to the build-host Python 3.12 executable.')
        buildPython python
        pip {
            options '--no-index', '--find-links', wheelhouse
            install '-r', new File(wheelhouse, 'requirements-android.lock.txt').absolutePath
        }
    }
    sourceSets { main { srcDir generatedPython } }
}

tasks.register('prepareToolkitPython', Sync) {
    from(new File(repository, 'backend')) { include portableSources }
    into generatedPython.map { it.dir('backend') }
}
tasks.register('prepareToolkitReader') {
    inputs.dir(readerFrontend)
    inputs.dir(new File(decoderBundle, 'assets'))
    inputs.dir(new File(cryptoBundle, 'assets'))
    inputs.dir(new File(hashBundle, 'assets'))
    inputs.file(new File(repository, 'packaging/android/publisher-hash-authored-vectors.json'))
    inputs.dir(cryptoFixtures)
    inputs.file(wuwaFixture)
    inputs.file(publisherPolicyFile)
    inputs.file(new File(wheelhouse, 'zstandard-build-receipt.json'))
    inputs.file(new File(repository, 'packaging/android/python-runtime-extensions.json'))
    inputs.file(new File(repository, 'packaging/android/zstandard-authored-vectors.json'))
    portableSources.each { inputs.file(new File(repository, 'backend/' + it)) }
    outputs.dir(generatedAssets)
    doLast {
        def output = generatedAssets.get().asFile
        delete(output)
        output.mkdirs()
        copy { from new File(decoderBundle, 'assets'); into output }
        copy { from new File(cryptoBundle, 'assets'); into output }
        copy { from new File(hashBundle, 'assets'); into output }
        copy { from new File(repository, 'packaging/android/publisher-hash-authored-vectors.json'); into output }
        copy { from cryptoFixtures; include 'publisher-crypto-authored-capi.bin', 'publisher-crypto-authored-jca.bin'; into output }
        copy { from wuwaFixture; into output; rename { 'wuwa-authored-bootstrap.json' } }
        copy { from publisherPolicyFile; into output; rename { 'publisher-source-policy.json' } }
        copy { from new File(wheelhouse, 'zstandard-build-receipt.json'); into output }
        copy { from new File(repository, 'packaging/android/python-runtime-extensions.json'); into output }
        copy { from new File(repository, 'packaging/android/zstandard-authored-vectors.json'); into output }
        // AAPT drops _next directories and expands .gz assets. One opaque
        // archive preserves the exact maintained desktop reader inventory.
        new java.util.zip.ZipOutputStream(new FileOutputStream(new File(output, 'reader.bundle'))).withCloseable { zip ->
            fileTree(readerFrontend).files.sort().each { source ->
                def name = new File(readerFrontend).toPath().relativize(source.toPath()).toString().replace('\\', '/')
                zip.putNextEntry(new java.util.zip.ZipEntry(name))
                zip.write(source.bytes)
                zip.closeEntry()
            }
        }
        def sources = [:]
        portableSources.each { name ->
            def bytes = new File(repository, 'backend/' + name).bytes
            sources['backend/' + name] = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        }
        new File(output, 'core-source-manifest.json').text = groovy.json.JsonOutput.toJson([schema:'toolkit-android-core-source-v1', files:sources])
    }
}
tasks.named('preBuild') { dependsOn 'prepareToolkitPython', 'prepareToolkitReader' }
tasks.configureEach {
    if (name.endsWith('PythonRequirements')) inputs.file(new File(wheelhouse, 'python-wheels-receipt.json'))
    if (name.endsWith('PythonSources')) dependsOn 'prepareToolkitPython'
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn 'prepareToolkitReader'
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
